# Provisional fajita device definition.
# Source: public edk2-sdm845 compatibility DTB; replace with an EDL-extracted DTB before hardware claims.

device fajita
	title       OnePlus 6T
	vendor      OnePlus
	soc         sdm845
	defconfig   fajita_defconfig
	maintainer  FireGuo
	status      display     partial   UEFI framebuffer path is defined by edk2-sdm845; not tested on this phone
	status      touch       missing   controller and coordinates still require the phone's own DTB
	status      buttons     missing   PMIC GPIO mapping still requires the phone's own DTB
	status      storage     missing   UFS layout and darwin partition have not been read from this phone
	status      gpu         missing   Adreno 630 registers and firmware are not yet validated on fajita
	status      wifi        missing   WCN3990 firmware and board data are not yet extracted from this phone
	status      audio       missing   audio DSP topology is not yet validated on fajita
	status      battery     missing   PMIC battery configuration is not yet validated on fajita
	status      cellular    missing   modem memory and IPA values are incomplete in the generic DTB
