# Provisional fajita device definition.
# Sources: compatibility DTB plus local EDL base/overlays; see EDL_INPUTS.md.

device fajita
	title       OnePlus 6T
	vendor      OnePlus
	soc         sdm845
	defconfig   fajita_defconfig
	maintainer  FireGuo
	status      display     partial   user reports stable iOS desktop with the quiet framebuffer image
	status      touch       works     device-tested `fastboot boot` image responds to touch; IRQ-mask readback is telemetry only, matching the vendor driver
	status      buttons     missing   PMIC GPIO mapping still requires the phone's own DTB
	status      storage     partial   GPT and APFS written with sampled readback; user reports iOS desktop
	status      gpu         partial   Adreno 630 bring-up ported from dipper (same SoC/GPU) and compiled; addresses match this device tree, firmware extracted; nothing written on the device yet
	status      wifi        missing   WCN3990 firmware and board data are not yet extracted from this phone
	status      audio       missing   audio DSP topology is not yet validated on fajita
	status      battery     missing   PMIC battery configuration is not yet validated on fajita
	status      cellular    missing   modem memory and IPA values are incomplete in the generic DTB
